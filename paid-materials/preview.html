x;align-items:baseline;gap:8px;\">\n\u003cspan style=\"font-size:28px;font-weight:700;color:#0f2a47;line-height:1;\">500円\u003c/span>\n\u003cspan style=\"font-size:12px;color:#5b6675;\">（税込）／ PDF・Notion用HTML\u003c/span>\n\u003c/div>\n\u003c!-- ▼ ① MemberPress 購入ページURL -->\n\u003ca href=\"MEMBERPRESS_URL\" style=\"display:inline-block;background:#0f2a47;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:12px 24px;border-radius:4px;letter-spacing:.04em;\">購入してレポートを読む\u003c/a>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdetails style=\"border-top:1px solid #d6dde6;background:#f6f8fa;\">\n\u003csummary style=\"cursor:pointer;padding:14px 28px;font-size:14px;font-weight:700;color:#0f2a47;\">レポートの詳細を見る\u003c/summary>\n\u003cdiv style=\"box-sizing:border-box;padding:8px 28px 32px;display:flex;flex-direction:column;gap:32px;background:#ffffff;\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px;\">\n\u003cdiv style=\"font-size:16px;font-weight:700;color:#0f2a47;padding-bottom:8px;border-bottom:2px solid #0f2a47;\">こんな課題をお持ちの企業様へ\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;\">\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「AIのPoC（試作）までは進んだが、本番の製造ラインに乗らない」\u003c/div>\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「チャンバーの経年劣化や異物発生による歩留まり低下に苦しんでいる」\u003c/div>\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「ベテラン技術者の『調整の勘所』や暗黙知を、AIにどう引き継ぐべきか分からない」\u003c/div>\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「自社のアクションや部材が、最先端ファブのAI化でどう評価されるか知りたい」\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px;\">\n\u003cdiv style=\"font-size:16px;font-weight:700;color:#0f2a47;padding-bottom:8px;border-bottom:2px solid #0f2a47;\">本資料で得られる4つの価値\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;\">\n\u003cdiv style=\"display:flex;gap:14px;\">\n\u003cspan style=\"flex:none;font-size:22px;font-weight:700;color:#c9a24a;line-height:1.3;\">01\u003c/span>\n\u003cdiv>\u003cdiv style=\"font-size:15px;font-weight:700;color:#0f2a47;\">最新論文の核心を15分で把握\u003c/div>\u003cdiv style=\"font-size:13px;color:#4a5563;\">ヨーロッパ半導体大手 STMicroelectronics の実ファブで検証された、従来の時間固定制御を超える「イベント駆動型強化学習（RL）」のメカニズムを解説。\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;gap:14px;\">\n\u003cspan style=\"flex:none;font-size:22px;font-weight:700;color:#c9a24a;line-height:1.3;\">02\u003c/span>\n\u003cdiv>\u003cdiv style=\"font-size:15px;font-weight:700;color:#0f2a47;\">インフォグラフィック図解付き\u003c/div>\u003cdiv style=\"font-size:13px;color:#4a5563;\">従来の定期制御とイベント駆動型RLの決定的な違い、自律フィードバックのステップを1枚の図解シートで直感的に理解できます。\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;gap:14px;\">\n\u003cspan style=\"flex:none;font-size:22px;font-weight:700;color:#c9a24a;line-height:1.3;\">03\u003c/span>\n\u003cdiv>\u003cdiv style=\"font-size:15px;font-weight:700;color:#0f2a47;\">TEL × Samsung 両視点の実務翻訳\u003c/div>\u003cdiv style=\"font-size:13px;color:#4a5563;\">東京エレクトロン（装置開発・経営）と Samsung Electronics（デバイス採用）の両最前線を経験した友安昌幸が、「作る側（装置）と使う側（ファブ）がどこで噛み合っていないか」を解き明かします。\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;gap:14px;\">\n\u003cspan style=\"flex:none;font-size:22px;font-weight:700;color:#c9a24a;line-height:1.3;\">04\u003c/span>\n\u003cdiv>\u003cdiv style=\"font-size:15px;font-weight:700;color:#0f2a47;\">装置・材料・部材メーカー向け導入チェックリスト\u003c/div>\u003cdiv style=\"font-size:13px;color:#4a5563;\">「データ準備の罠」「工程能力（Cpk）と信頼度の連動」「ベテランが無視しない現場UI」「客先QAへの説明スクリプト」まで踏み込んだ実用ガイド。\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px;\">\n\u003cdiv style=\"font-size:16px;font-weight:700;color:#0f2a47;padding-bottom:8px;border-bottom:2px solid #0f2a47;\">価格 splay:flex;flex-direction:column;justify-content:space-between;gap:20px;\">\n\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n\u003cspan style=\"display:inline-block;background:#c9a24a;color:#0f2a47;font-size:12px;font-weight:700;letter-spacing:.08em;padding:2px 10px;border-radius:2px;\">有料レポート\u003c/span>\n\u003cspan style=\"display:inline-block;border:1px solid rgba(255,255,255,.55);color:#ffffff;font-size:12px;letter-spacing:.04em;padding:1px 10px;border-radius:2px;\">arXiv:2609.32473\u003c/span>\n\u003c/div>\n\u003cdiv style=\"font-size:20px;font-weight:700;line-height:1.55;letter-spacing:.02em;\">計算リソグラフィにおける自己進化型・仮想プロセスエンジニアAI（VPEvolve）の衝撃\u003c/div>\n\u003cdiv style=\"font-size:13px;line-height:1.6;color:#c9d6e5;\">2026年9月26日発表\u003cbr>最新論文解説\u003c/div>\n\u003c/div>\n\u003cdiv style=\"box-sizing:border-box;flex:1.4 1 360px;padding:28px 28px 24px;display:flex;flex-direction:column;gap:16px;\">\n\u003cdiv style=\"font-size:18px;font-weight:700;line-height:1.6;color:#0f2a47;\">「ベテランの勘と手動ルール追加に頼る露光・OPC補正は、もう限界を迎えている」\u003c/div>\n\u003cdiv style=\"font-size:14px;color:#4a5563;margin:0;\">過去のエンジニアリング知見（Skill Bank）を保持し、欠陥（hotspot）を自律修復するAI Agentの全貌。\u003c/div>\n\u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-top:auto;padding-top:16px;border-top:1px solid #e6ebf0;\">\n\u003cdiv style=\"display:flex;align-items:baseline;gap:8px;\">\n\u003cspan style=\"font-size:28px;font-weight:700;color:#0f2a47;line-height:1;\">500円\u003c/span>\n\u003cspan style=\"font-size:12px;color:#5b6675;\">（税込）／ PDF資料\u003c/span>\n\u003c/div>\n\u003c!-- ▼ ① Stripe 決済ページURL -->\n\u003ca href=\"STRIPE_URL\" style=\"display:inline-block;background:#0f2a47;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:12px 24px;border-radius:4px;letter-spacing:.04em;\">購入してレポートを読む\u003c/a>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdetails style=\"border-top:1px solid #d6dde6;background:#f6f8fa;\">\n\u003csummary style=\"cursor:pointer;padding:14px 28px;font-size:14px;font-weight:700;color:#0f2a47;\">レポートの詳細を見る\u003c/summary>\n\u003cdiv style=\"box-sizing:border-box;padding:8px 28px 32px;display:flex;flex-direction:column;gap:32px;background:#ffffff;\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px;\">\n\u003cdiv style=\"font-size:16px;font-weight:700;color:#0f2a47;padding-bottom:8px;border-bottom:2px solid #0f2a47;\">こんな課題をお持ちの企業様へ\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;\">\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「先端ノード（3nm/2nm）の露光補正（OPC）ルールが複雑化し、干渉による歩留まり低下に悩んでいる」\u003c/div>\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「熟練プロセスエンジニアの勘や過去のトラブルシューティングログが個人に散逸している」\u003c/div>\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「試行錯誤によるOPCレシピ修正に数週間を要し、量産立ち上げ（Qualification）が遅れている」\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px;\">\n\u003cdiv style=\"font-size:16px;font-weight:700;color:#0f2a47;padding-bottom:8px;border-bottom:2px solid #0f2a47;\">本資料で得られる4つの価値\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;\">\n\u003cdiv style=\"display:flex;gap:14px;\">\n\u003cspan style=\"flex:none;font-size:22px;font-weight:700;color:#c9a24a;line-height:1.3;\">01\u003c/span>\n\u003cdiv>\u003cdiv style=\"font-size:15px;font-weight:700;color:#0f2a47;\">自律修復AI（VPEvolve）の最新動向を15分で把握\u003c/div>\u003cdiv style=\"font-size:13px;color:#4a5563;\">Virtual Process Engineer（VPE）Harness と Skill Bank による自己進化型補正メカニズムを解説。\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;gap:14px;\">\n\u003cspan style=\"flex:none;font-size:22px;font-weight:700;color:#c9a24a;line-height:1.3;\">02\u003c/span>\n\u003cdiv>\u003cdiv style=\"font-size:15px;font-weight:700;c 2a47;\">「モデルの重みを書き換えず、“最初の一手”だけを現場に合わせる」\u003c/div>\n\u003cdiv style=\"font-size:14px;color:#4a5563;margin:0;\">安全ガードレールを一切破らず、わずか10〜20回の実機試行でタスク成功率0%→85%以上に引き上げた自律適応AIの全貌。\u003c/div>\n\u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-top:auto;padding-top:16px;border-top:1px solid #e6ebf0;\">\n\u003cdiv style=\"display:flex;align-items:baseline;gap:8px;\">\n\u003cspan style=\"font-size:28px;font-weight:700;color:#0f2a47;line-height:1;\">500円\u003c/span>\n\u003cspan style=\"font-size:12px;color:#5b6675;\">（税込）／ PDF資料（全14ページ）\u003c/span>\n\u003c/div>\n\u003ca href=\"STRIPE_URL\" style=\"display:inline-block;background:#0f2a47;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:12px 24px;border-radius:4px;letter-spacing:.04em;\">購入してレポートを読む\u003c/a>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdetails style=\"border-top:1px solid #d6dde6;background:#f6f8fa;\">\n\u003csummary style=\"cursor:pointer;padding:14px 28px;font-size:14px;font-weight:700;color:#0f2a47;\">レポートの詳細を見る\u003c/summary>\n\u003cdiv style=\"box-sizing:border-box;padding:8px 28px 32px;display:flex;flex-direction:column;gap:32px;background:#ffffff;\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px;\">\n\u003cdiv style=\"font-size:16px;font-weight:700;color:#0f2a47;padding-bottom:8px;border-bottom:2px solid #0f2a47;\">こんな課題をお持ちの企業様へ\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;\">\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「ロボットAI（VLAモデル）を自社ラインに導入したいが、ファインチューニングで安全制御が壊れるリスクが怖い」\u003c/div>\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「実機での試行錯誤には1回あたり数百万円規模の機器破損・ライン停止リスクが伴い、気軽にAIを試せない」\u003c/div>\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「ベテラン技術者の“微調整のコツ”が属人化しており、AI導入でもこのノウハウを活かせる仕組みが見えない」\u003c/div ont-weight:700;color:#0f2a47;line-height:1;\">500円\u003c/span>\n\u003cspan style=\"font-size:12px;color:#5b6675;\">（税込）／ PDF資料\u003c/span>\n\u003c/div>\n\u003ca href=\"STRIPE_URL\" style=\"display:inline-block;background:#0f2a47;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:12px 24px;border-radius:4px;letter-spacing:.04em;\">購入してレポートを読む\u003c/a>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdetails style=\"border-top:1px solid #d6dde6;background:#f6f8fa;\">\n\u003csummary style=\"cursor:pointer;padding:14px 28px;font-size:14px;font-weight:700;color:#0f2a47;\">レポートの詳細を見る\u003c/summary>\n\u003cdiv style=\"box-sizing:border-box;padding:8px 28px 32px;display:flex;flex-direction:column;gap:32px;background:#ffffff;\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px;\">\n\u003cdiv style=\"font-size:16px;font-weight:700;color:#0f2a47;padding-bottom:8px;border-bottom:2px solid #0f2a47;\">こんな課題をお持ちの企業様へ\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;\">\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「z-scan等の間接的な測定では、非線形光学応答の時間的な変化まで捉えられない」\u003c/div>\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「瞬時のKerr効果と、遅延する自由キャリア効果を分けて材料評価したい」\u003c/div>\n\u003cdiv style=\"font-size:14px;padding:12px 16px;background:#f6f8fa;border-radius:4px;\">「中赤外領域のフォトニクスや、ゲルマニウムなどの半導体材料の非線形特性を正確に把握したい」\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px;\">\n\u003cdiv style=\"font-size:16px;font-weight:700;color:#0f2a47;padding-bottom:8px;border-bottom:2px solid #0f2a47;\">本資料で得られる4つの価値\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;\">\n\u003cdiv style=\"display:flex;gap:14px;\">\n\u003cspan style=\"flex:none;font-size:22px;font-weight:700;color:#c9a24a;line-height:1.3;\">01\u003c/span>\n\u003cdiv>\u003cdiv style=\"font-size:15px;font-weight:700;color:#0f2a47;\">電界分解ポンプ・プローブ測定を15分で理解\u003c/div>\u003cdiv style=\"font-size:13px;color:#4a5563;\">強いポンプ光と弱いプローブ光の時間差を変えながら、透過する電界の位相変化を直接読み取る仕組みを、専門外でも分かる表現で整理。\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;gap:14px;\">\n\u003cspan style=\"flex:none;font-size:22px;font-weight:700;color:#c9a24a;line-height:1.3;\">02\u003c/span>\n\u003cdiv>\u003cdiv style=\"font-size:15px;font-weight:700;color:#0f2a47;\">測定原理と応答分離を図解\u003c/div>\u003cdiv style=\"font-size:13px;color:#4a5563;\">通常の強度ベース測定と電界分解測定の違い、瞬時Kerr応答と遅延成分の見分け方を1枚で図解。\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;gap:14px;\">\n\u003cspan style=\"flex:none;font-size:22px;font-weight:700;color:#c9a24a;line-height:1.3;\">03\u003c/span>\n\u003cdiv>\u003cdiv style=\"font-size:15px;font-weight:700;color:#0f2a47;\">ゲルマニウムの実測値を正しく読み解く\u003c/div>\u003cdiv style=\"font-size:13px;color:#4a5563;\">波長5μmにおける非線形屈折率 n\u003csub>2\u003c/sub>=(0.87±0.16)×10\u003csup>-17\u003c/sup> m²/Wと、位相変化がポンプ強度に比例して増える結果を解説。\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;gap:14px;\">\n\u003cspan style=\"flex:none;font-size:22px;font-weight:700;color:#c9a24a;line-height:1.3;\">04\u003c/span>\n\u003cdiv>\u003cdiv style=\"font-size:15px;font-weight:700;color:#0f2a47;\">TEL × Samsung 両視点：材料・計測・装置開発への示唆\u003c/div>\u003cdiv style=\"font-size:13px;color:#4a5563;\">半導体材料の特性評価、計測装置の差別化、中赤外フォトニクスへの応用を、装置側とデバイス側の双方の視点で考察。\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:12px;\">\n\u003cdiv style=\"font-size:16px;font-weight:700;color:#0f2a47;padding-bottom:8px;border-bottom:2px solid #0f2a47;\">価格・提供フォーマット\u003c/div>\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;font-size:14px;\">\n\u003cdiv style=\"padding:12px 16px;border:1px solid #d6dde6;border-radius:4px;\">\u003cdiv style=\"font-size:12px;color:#5b6675;\">価格\u003c/div>\u003cdiv style=\"font-weight:700;color:#0f2a47;\">500円（税込）\u003c/div>\u003c/div>\n\u003cdiv style=\"padding:12px 16px;border:1px solid #d6dde6;border-radius:4px;\">\u003cdiv style=\"font-size:12px;color:#5b6675;\">形式\u003c/div>\u003cdiv>高品位PDF資料（A4・印刷対応）\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 24px;padding:24px;background:#0f2a47;border-radius:4px;\">\n\u003cspan style=\"color:#ffffff;font-size:15px;font-weight:700;\">500円（税込）でいますぐダウンロード\u003c/span>\n\u003ca href=\"STRIPE_URL\" style=\"display:inline-block;background:#c9a24a;color:#0f2a47;text-decoration:none;font-size:15px;font-weight:700;padding:12px 28px;border-radius:4px;letter-spacing:.04em;\">500円で購入してレポートを読む\u003c/a>\n\u003c/div>\n\u003c/div>\n\u003c/details>\n\u003c/div>\n\u003c!-- ===== /有料資料カード #007 ===== -->\n"}];
let cur = CARDS.length - 1; // 既定は最新カード
let copied = false;
const $ = id => document.getElementById(id);

function render() {
  const c = CARDS[cur];
  $('tabs').innerHTML = '';
  CARDS.forEach((x, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.textContent = '#' + x.id;
    b.title = x.file;
    b.setAttribute('aria-pressed', String(i === cur));
    b.onclick = () => { cur = i; copied = false; render(); };
    $('tabs').appendChild(b);
  });
  $('host').innerHTML = c.html;
  $('rawText').value = c.html;
  setCopyLabel();
}

// コピー状態の表示だけ更新（プレビューを再描画すると開いた詳細が閉じるため）
function setCopyLabel() {
  $('copy').textContent = copied ? 'コピーしました' : '#' + CARDS[cur].id + ' のHTMLをコピー';
}

function showRaw(on) {
  $('raw').hidden = !on;
  $('toggleRaw').setAttribute('aria-expanded', String(on));
  $('toggleRaw').textContent = on ? 'HTMLを隠す' : 'HTMLを表示';
}

$('toggleRaw').onclick = () => showRaw($('raw').hidden);
$('rawText').onclick = $('rawText').onfocus = e => e.target.select();

$('copy').onclick = async () => {
  const html = CARDS[cur].html;
  let ok = false;
  try { await navigator.clipboard.writeText(html); ok = true; } catch (e) {}
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = html;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (!ok) { showRaw(true); $('rawText').focus(); return; }
  copied = true;
  setCopyLabel();
  setTimeout(() => { copied = false; setCopyLabel(); }, 2000);
};

render();
</script>
